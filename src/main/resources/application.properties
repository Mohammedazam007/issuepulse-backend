# =============================================
# IssuePulse - Application Configuration
# =============================================

server.port=8080

# =============================================
# MySQL Database
# =============================================

# =============================================
# PostgreSQL Database
# =============================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT Configuration
# =============================================
# Change this secret in production (min 256-bit / 32 chars)
app.jwt.secret=IssuePulseSecretKey2024@CampusComplaintSystem#Secure!
app.jwt.expiration-ms=86400000

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=uploads

# =============================================
# Student email domain validation
# =============================================
app.student.email-domain=@anurag.edu.in

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# =============================================
# Logging
# =============================================
logging.level.com.issuepulse=DEBUG
